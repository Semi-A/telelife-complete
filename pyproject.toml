[project]
name = "telelife"
version = "0.1.0"
description = "TeleLife / TeleWorld - Telegram Virtual Life Simulator"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot[rate-limiter,webhooks,job-queue]>=22.7",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyYAML>=6.0.2",
    "uvicorn[standard]>=0.31.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.4",
    "orjson>=3.10.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "ruff>=0.6.0", "mypy>=1.11.0"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
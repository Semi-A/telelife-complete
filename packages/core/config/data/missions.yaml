# Daily missions. Pool is sampled per player per day - deterministic by
# (player_id, date) so a restart never reshuffles someone's missions.
daily:
  count_per_day: 3
  reroll_allowed: false

pool:
  - key: claim_daily
    title: "جایزه روزانه‌تو بگیر"
    target: 1
    reward_toman: 15000
    reward_xp: 30
    min_level: 1

  - key: check_profile
    title: "یه سر به پروفایلت بزن"
    target: 1
    reward_toman: 8000
    reward_xp: 15
    min_level: 1

  - key: earn_xp_100
    title: "۱۰۰ تا XP جمع کن"
    target: 100
    reward_toman: 40000
    reward_xp: 50
    min_level: 2

  - key: group_active
    title: "تو یه گروه فعال باش"
    target: 1
    reward_toman: 20000
    reward_xp: 35
    min_level: 2

  - key: streak_keeper
    title: "استریکتو نگه دار"
    target: 1
    reward_toman: 25000
    reward_xp: 40
    min_level: 3

    metric_key: food_donated
    target_amount: 100
    reward_amount: 10
    reward_magnitude_basis_points: 1000
  country_mineral_drive:
    metric_key: minerals_donated
    target_amount: 80
    reward_amount: 10
    reward_magnitude_basis_points: 1000

progress:
  eligible_actions:
    donate:
      food: food_donated
      minerals: minerals_donated
  clamp_to_target: true
  completion_is_idempotent: true
